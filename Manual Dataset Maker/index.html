<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rúna JSONL Builder</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 1.5rem;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 1rem;
    }

    .panel {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 0.5rem;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel h2 {
      font-size: 0.95rem;
      margin: 0 0 0.5rem 0;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: vertical;
      min-height: 140px;
      background: #020617;
      color: #e5e7eb;
      border-radius: 0.375rem;
      border: 1px solid #374151;
      padding: 0.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    textarea[readonly] {
      background: #020617;
    }

    .controls {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button {
      border-radius: 0.375rem;
      border: 1px solid #4b5563;
      background: #111827;
      color: #e5e7eb;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button.primary {
      background: #10b981;
      border-color: #059669;
      color: #022c22;
      font-weight: 600;
    }

    button.primary:hover {
      background: #059669;
    }

    button:hover {
      background: #1f2937;
    }

    .status {
      margin-left: auto;
      font-size: 0.8rem;
      color: #9ca3af;
      align-self: center;
    }

    .jsonl-panel textarea {
      min-height: 260px;
      resize: vertical;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
    }
  </style>
</head>
<body>
  <h1>Rúna JSONL Builder</h1>
  <div class="subtitle">
    Paste <strong>what they said</strong> into <em>Input</em>, your <strong>reply</strong> into <em>Output</em>, then hit
    <strong>Add to JSONL</strong>. Repeat until you have a pile of training pairs.
  </div>

  <div class="layout">
    <!-- Input panel -->
    <div class="panel">
      <h2>Input (what they said)</h2>
      <textarea id="inputText" placeholder="Paste the other person's comment here..."></textarea>
    </div>

    <!-- Output panel -->
    <div class="panel">
      <h2>Output (your reply)</h2>
      <textarea id="outputText" placeholder="Paste or write your reply here..."></textarea>
    </div>

    <!-- JSONL panel -->
    <div class="panel jsonl-panel" style="grid-column: 1 / -1;">
      <h2>JSONL Preview (one training example per line)</h2>
      <textarea id="jsonlText" readonly placeholder='{"input": "...", "output": "..."}'></textarea>

      <div class="controls">
        <button id="addBtn" class="primary">Add to JSONL</button>
        <button id="clearCurrentBtn">Clear Input &amp; Output</button>
        <button id="copyBtn">Copy JSONL to Clipboard</button>
        <button id="downloadBtn">Download JSONL</button>
        <button id="clearAllBtn">Clear All</button>
        <div class="status" id="statusText">0 examples</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
